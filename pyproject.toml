[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "EEG-Classifiers-Ensemble"
version = "1.0.0"
description = "Leakage-safe voting ensembles of diverse EEG classifiers, with a pre-registered cross-session benchmark."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Alma Rosa Cuevas Romero", email = "almarosa.arcr@gmail.com"},
  {name = "Luz María Alonso-Valerdi"},
  {name = "Luis Alberto Muñoz-Ubando"},
  {name = "Alejandro A. Torres-García"},
]
keywords = ["EEG", "brain-computer interface", "ensemble", "voting", "classification", "MOABB"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Lower bounds are the versions the paper ran with (requirements-ensemble.lock.txt).
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  # <0.14: the frozen features.py imports pyriemann.utils.*, deprecated in 0.12 and removed in 0.14
  "pyriemann>=0.7,<0.14",
  "mne>=1.8",
]

[project.optional-dependencies]
# complexity_boosting and minirocket voters
features = ["antropy>=0.2", "sktime>=0.30"]
# network voters: EEGNet, ShallowNet, ATCNet, FBCNet, EEGInception (braindecode) and GREEN
# braindecode <1.6: the frozen voters.py uses EEGNetv4, removed in 1.6
deep = ["torch>=2.5", "braindecode>=1.2,<1.6", "geotorch>=0.3", "lightning>=2.4"]
# public datasets for the benchmark
benchmark = ["moabb>=1.2"]
all = ["EEG-Classifiers-Ensemble[features,deep,benchmark]"]
dev = ["EEG-Classifiers-Ensemble[features]", "pytest>=8"]

[project.urls]
Repository = "https://github.com/AlmaCuevas/EEG-Classifiers-Ensemble"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"processing_eeg_methods.ensemble" = ["PROTOCOL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
