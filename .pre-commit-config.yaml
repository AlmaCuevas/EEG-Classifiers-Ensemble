# The pre-registered code must stay byte-identical to its fingerprints in PROTOCOL.md,
# so no hook may reformat it.
exclude: |
  (?x)^(
    src/processing_eeg_methods/ensemble/(__init__|features|voters|voting_ensemble|benchmark_moabb|
      analyze_voters|extra_voters|benchmark_extra|select_voters|voter_cost_benefit)\.py
    |requirements-ensemble\.lock\.txt
  )$
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black"]
-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
    -   id: flake8
        args: ["--extend-ignore", "F841, E203, E501"]
